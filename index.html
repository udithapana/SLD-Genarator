<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar SLD Generator</title>
<meta name="theme-color" content="#0a7a2f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f4;--card:#fff;--tx:#17202b;--mu:#586474;--bd:#cfd6df;--ac:#0a5fb4;--in:#f7f9fb}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1a2028;--tx:#e6e9ee;--mu:#98a3b1;--bd:#2f3844;--ac:#63a7f2;--in:#222a34}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1a2028;--tx:#e6e9ee;--mu:#98a3b1;--bd:#2f3844;--ac:#63a7f2;--in:#222a34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "IBM Plex Sans","Segoe UI",Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:600;flex:1 1 auto}
button{font:inherit;padding:7px 13px;border-radius:6px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--ac)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;padding:14px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.side{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 14px 14px}
fieldset{border:0;border-top:1px solid var(--bd);margin:10px 0 0;padding:8px 0 0}
fieldset:first-child{border-top:0;margin-top:0}
legend{font-weight:600;padding:0 6px 0 0;color:var(--ac)}
label{display:block;margin:7px 0 0;color:var(--mu);font-size:12px}
input{width:100%;margin-top:2px;padding:6px 8px;border:1px solid var(--bd);border-radius:5px;background:var(--in);color:var(--tx);font:inherit}
.dwg{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto}
.paper{background:#fff;min-width:900px}
.paper svg{display:block;width:100%;height:auto}
button.alt.on{background:var(--ac);color:#fff}
#msg{font-size:12px;color:var(--mu)}
@media print{header,.side{display:none}main{display:block;padding:0}.dwg{border:0;padding:0}.paper{min-width:0}@page{size:A4 landscape;margin:6mm}}
input[readonly]{background:var(--bg);color:var(--mu)}
.tag{font-size:10px;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:0 5px;margin-left:4px}
input.man{border-color:#d9822b}
select{width:100%;margin-top:2px;padding:6px 8px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--tx);font:inherit}
.inv{border:1px solid var(--bd);border-radius:8px;padding:6px 10px 10px;margin:8px 0;background:var(--in)}
.sub{border-top:1px dashed var(--bd);margin-top:12px;padding-top:10px}
.sub>b{display:block;margin-bottom:4px;font-size:13px}
.ih{display:flex;justify-content:space-between;align-items:center}
.ic{padding:3px 7px;background:transparent;color:#c0392b;border-color:#c0392b}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inf{font-size:11px;color:var(--mu);margin-top:6px}
fieldset>button{margin-top:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:7px 4px;font-size:12.5px}
.hint{font-size:11px;color:var(--mu);margin-top:8px}
#out3{background:#fff;border-radius:4px;padding:18px;min-height:200px}
.hist-empty{color:var(--mu);padding:30px;text-align:center}
.hist-item{border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hist-item b{display:block;font-size:14px}
.hist-item span{font-size:12px;color:var(--mu)}
.hist-item .btns{display:flex;gap:6px}
.hist-item .btns button{padding:5px 10px;font-size:12px}
@media print{#out3{display:none!important}}
[hidden]{display:none!important}

/* left-panel tabs */
.tabs{position:sticky;top:-6px;z-index:5;display:flex;flex-wrap:wrap;gap:5px;margin:0 -14px 4px;padding:10px 14px 9px;background:var(--card);border-bottom:1px solid var(--bd)}
.tabs button{flex:1 1 auto;padding:6px 8px;font-size:12px;white-space:nowrap}
.pane>fieldset:first-child{border-top:0;margin-top:0}
/* laptop / desktop: the drawing stays put on the right, only the left panel scrolls */
@media screen and (min-width:861px){
 html,body{height:100%}
 body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
 main{flex:1 1 auto;min-height:0;grid-template-rows:minmax(0,1fr);align-items:stretch}
 .side{overflow-y:auto;min-height:0;overscroll-behavior:contain}
 .dwg{overflow:auto;min-height:0;container-type:size}
 .paper{min-width:760px;max-width:calc((100cqh - 2px)*1.4133);margin:0 auto}
}
</style></head>

<script>/* Auto-selection rules: inverter/BESS current -> cables, MCCB, isolator, busbar, earth.
   Edit the tables below to match company standards. */
(function (G) {
  const S = G.SLD = G.SLD || {};
  const MCB = [32,40,63], MCCB = [100,160,250,400,630,800,1000,1250,1600], ACB = [2000,2500,3200,4000];                // the ONLY breaker ratings used (A)
  const STD = MCB.concat(MCCB, ACB);                                                                       // breaker / isolator ratings (A): MCB 32-63, MCCB 100-1600, ACB 2000-4000
  const BUS = [63,100,125,160,200,250,400,630,800,1000,1250,1600,2000,2500,3200,4000];                       // busbar ratings (A)
  const CAB = [[28.4,6,'Cu/PVC/PVC'],[33.3,10,'Cu/PVC/PVC'],[58,16,'Cu/PVC/PVC'],[63.8,25,'Al/PVC/PVC'],[83.6,35,'Al/XLPE/PVC'],
               [95.7,50,'Al/XLPE/PVC'],[127,70,'Al/XLPE/PVC'],[166.7,95,'Al/XLPE/PVC'],[206.1,120,'Al/XLPE/PVC'],[250,150,'Al/XLPE/PVC']]; // [max A, mm2, type] (from Supporting_file.xlsx)
  const EAR = [[33.3,6],[63.8,10],[127,16],[183.3,25],[206.1,35],[1e9,50]];                              // [max A, Cu earth mm2]
  // PV array (roof / module-side) main earth conductor, Cu mm2, by number of PV arrays (one per inverter) bonded together on the roof.
  // Rule-of-thumb step table following IEC 62548 / IEC 60364-5-54 practice (min 4 mm2 mechanically protected; larger as more arrays share the conductor) — edit to your standard; the UI also has an override.
  const PVE = [[1,4],[3,6],[6,10],[10,16],[16,25],[1e9,35]];   // [max arrays, Cu mm2]
  const MARGIN = 1.25;                                                                                    // breaker = next standard size >= 1.25 x current
  const AC_V = 1.518;                                                                                     // kW -> A at 400V 3ph, ~0.95 PF (for BESS PCS sizing)
  const up = (v, l) => l.find(x => x >= v) || l[l.length - 1];
  const cabFor = I => CAB.find(c => I <= c[0]) || CAB[CAB.length - 1];
  const earFor = I => EAR.find(c => I <= c[0])[1];
  // Breaker family from its rating: MCB up to 63 A, MCCB 100-1600 A, ACB above. A MCCB / ACB whose load current is below 20 % of its rating
  // (typically an over-sized or manually-overridden breaker) is specified with an ADJUSTABLE trip unit so it can still be set close to the load.
  S.brkType = (a, I) => { a = +a; const t = a <= 63 ? 'MCB' : a <= 1600 ? 'MCCB' : 'ACB'; return t + (t != 'MCB' && +I > 0 && +I < 0.2 * a ? ' ADJ.' : ''); };
  const fmt = s => s.replace(/mm2/g, 'mm²').replace(/\/ ?PVc/i, '/PVC').replace(' Earth Cable', ' Earth');
  const kwOf = (m, I) => { const r = m.match(/(\d+(?:\.\d+)?)\s*K/) || m.match(/(?:SG|HPS-|planet\s)(\d+(?:\.\d+)?)/i); return r ? +r[1] : +(I * 0.6928).toFixed(1); };
  S.strCount = cfg => String(cfg).split('+').reduce((a, p) => { const m = p.match(/(\d+)\s*[x×*]\s*(\d+)/); return a + (m ? +m[2] : (p.trim() ? 1 : 0)); }, 0);
  // Per-inverter electrical info from the parts database. DC cable is NOT included here:
  // it depends on the physical run length between the array and the inverter, so it stays a manual, per-inverter field in the UI.
  S.info = e => {
    const I = e.current, c = cabFor(I), b = e.brand.split(' ')[0];
    return { name: e.model.startsWith(b) ? e.model : b + ' ' + e.model, kw: kwOf(e.model, I), I, hybrid: e.type == 'hybrid',
             ac: e.ac ? fmt(e.ac) : `${c[1]}mm²/4C/${c[2]}`, earth: fmt(e.earth || `${earFor(I)}mm2 Cu/ PVc Earth Cable`),
             mccb: up(MARGIN * I, STD), derived: !e.ac };
  };
  // Generic cable size for a given current (used for the load feeder cable, sized from its MCCB rating).
  S.pvEarth = n => `${PVE.find(r => (+n || 1) <= r[0])[1]}mm² Cu`;
  S.cableFor = I => { const c = cabFor(+I || 0); return `${c[1]}mm² 4C/Cu/XLPE/PVC`; };
  // Per-BESS-unit electrical info, derived from its PCS kW rating (no parts-database entry for batteries).
  S.bessInfo = kw => { const I = +kw * AC_V, c = cabFor(I); return { I, mccb: up(MARGIN * I, STD), ac: `${c[1]}mm²/4C/${c[2]}`, earth: `${earFor(I)}mm² Cu` }; };
  // System-level sizing. Main breaker/panel/busbar/main cable are sized on whichever is larger of the total
  // solar-inverter current or the total standalone-BESS-PCS current — NOT their sum — because the battery only
  // discharges through the panel while the solar inverters are off (night / outage), so the two never add together.
  S.derive = (invCurrents, bessCurrents, mode) => {
    const Ti = invCurrents.reduce((a, c) => a + c, 0), Tb = bessCurrents.reduce((a, c) => a + c, 0), T = Math.max(Ti, Tb);
    const iso = up(MARGIN * T, STD), sets = Math.ceil(T / 250) || 1, c = cabFor(T / sets);
    return { T, iso, panel: iso, bus: up(iso, BUS), isoBus: up(iso, BUS),
      meterLbl: { nm: 'BI-DIRECTIONAL METER', na: 'IMPORT / EXPORT METER', np: 'GENERATION METER' }[mode] || '',
      mainCable: `${c[1]}mm² 1C/Cu/XLPE/PVC (4 Runs${sets > 1 ? ' × ' + sets + ' sets' : ''})`,
      utilCable: `${c[1]}mm² 4C/Cu/XLPE/PVC${sets > 1 ? ' × ' + sets : ''}`, earthMain: `${earFor(T)}mm² Cu` };
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>/* Draws both diagrams as SVG strings, laid out directly on one fixed A4-landscape sheet.
   The outer border/title block/earth section always sit at the same page position; only the
   repeating inverter/BESS symbols compress (many units) or centre (few units) to fill the space.
   Pure functions: renderBlock(values, inverters, bessUnits) / renderSLD(values, inverters, bessUnits). */
(function (G) {
const S = G.SLD = G.SLD || {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let V = {}, INV = [], BESS = [], INV2 = [], BESS2 = [];
const LOGO = G.SLD_LOGO || '';
const g = id => String(V[id] == null ? '' : V[id]).trim();
const CFGN = () => ({ nm: 'Net metering', na: 'Net accounting', np: 'Net plus', og: 'Off-grid' }[V.mode] || 'Net metering'), md = () => V.mode || 'nm';
const dfmt = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso.split('-').reverse().join('/') : iso;
const wslash = (s, n) => { const p = String(s).split('/'), out = []; let cur = ''; p.forEach(w => { const cand = cur ? cur + '/' + w : w; if (cur && cand.length > n) { out.push(cur + '/'); cur = w; } else cur = cand; }); if (cur) out.push(cur); return out; }; // wrap a cable spec at '/' boundaries
const BT = (a, I) => S.brkType(a, I); // MCB (32/40/63 A), MCCB (100-1600 A), ACB (2000-4000 A); 'ADJ.' = adjustable trip unit when the load current I is below 20 % of the rating
const ALLI = () => INV.concat(V.loc2on ? INV2 : []), ALLB = () => BESS.concat(V.loc2on ? BESS2 : []); // both locations (title block / totals)
const units = () => INV.map(u => ({ ...u, kind: 'inv' })).concat(BESS.map(u => ({ ...u, kind: 'bess' })));
const A4W = 1587, A4H = 1123; // fixed A4-landscape page (~135 dpi) — the sheet size never changes
const page = inner => `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${A4W}" height="${A4H}" viewBox="0 0 ${A4W} ${A4H}" font-family="Arial, Helvetica, sans-serif"><rect width="${A4W}" height="${A4H}" fill="#fff"/>${inner}</svg>`;
// Drawing window: inner frame whose left/right edges line up with the title block (same margin BM=10, i.e. 6 px from the border line at x=4) and with the same 6 px gap above the title block (two separate windows)
const FRAME=W=>`<g data-layer="FRAME"><rect x="10" y="10" width="${W-20}" height="${A4H-10-105-6-10}" fill="none" stroke="#000" stroke-width="1.5"/></g>`;
// Title block (ISO 7200-style ruled grid): logo | title + (Drawing No | Revision | Date) strip | 2×2 equipment cells (inverters, solar modules, BESS PCS, batteries) | ruled approvals table.
// Drawn in absolute page coordinates (no diagram stretch) and sits the same distance from the left, right and bottom page border (BM).
function TB(s,W,wp,qty,kwp,title){
const H=105,BM=10,y0=A4H-BM-H,yb=y0+H,x0=BM,x1=W-BM,d1=150,d2=790,d3=W-330,ed=(d2+d3)/2,eh=H/2;

    if (e.target.closest('#addInv2')) { INVS2.push(INVS2.length ? { ...INVS2[INVS2.length - 1] } : { ...INVS[0] }); drawInvs2(); update(); return; }
    if (e.target.closest('#addBess2')) { BESSU2.push(BESSU2.length ? { ...BESSU2[BESSU2.length - 1] } : { kwh: 100, kw: 50, model: 'BESS', ov: '', acOv: '', dc: 'DC cable' }); drawBess2(); update(); return; }
    const rm = e.target.closest('[data-a=rm]'); if (!rm) return;
    if (rm.closest('#invList2')) { INVS2.splice(+rm.closest('.inv').dataset.i, 1); drawInvs2(); update(); }
    else if (rm.closest('#bessList2')) { BESSU2.splice(+rm.closest('.inv').dataset.i, 1); drawBess2(); update(); }
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { MODE = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x == b)); if (LOC2.on) drawLoc2Shell(); update(); });
  $('rst').onclick = () => { manual.clear(); update(); };
  $('form').addEventListener('input', e => { if (AUTO.has(e.target.id)) manual.add(e.target.id); update(); });
  function mkInvInfos(list) { return list.map(s => { const e = D[s.m], x = S.info(e), o = parseFloat(s.ov); return { ...x, mods: +s.mods || 0, cfg: s.cfg, dc: s.dc, strs: S.strCount(s.cfg), mccb: o > 0 ? o : x.mccb, ac: s.acOv || x.ac, acOverridden: !!s.acOv, battKwh: +s.battKwh || 0, battDc: s.battDc }; }); }
  function mkBessInfos(list) { return list.map(s => { const x = S.bessInfo(+s.kw || 0), o = parseFloat(s.ov); return { ...x, kwh: +s.kwh || 0, kw: +s.kw || 0, model: s.model, dc: s.dc, mccb: o > 0 ? o : x.mccb, ac: s.acOv || x.ac, acOverridden: !!s.acOv }; }); }
  function update() {
    const wp = +$('modWp').value || 0;
    const invInfos = mkInvInfos(INVS), bessInfos = mkBessInfos(BESSU);
    const invInfos2 = LOC2.on ? mkInvInfos(INVS2) : [], bessInfos2 = LOC2.on ? mkBessInfos(BESSU2) : [];
    // Location 2's own incomer breaker (both ends of its interconnecting cable) is sized from Location 2's own current only —
    // it never changes when main-location inverters/BESS are added, and is recalculated whenever Location 2's own units change.
    const d2 = LOC2.on ? S.derive(invInfos2.map(i => i.I), bessInfos2.map(b => b.I), MODE) : null;
    // System sizing: if Location 2 feeds the MAIN panel, that panel (breaker, busbar, cable) carries both locations; if it feeds the
    // ISOLATION panel, the main panel stays main-only while the isolator / isolation busbar / utility cable carry the total.
    const allI = invInfos.concat(LOC2.on ? invInfos2 : []).map(i => i.I), allB = bessInfos.concat(LOC2.on ? bessInfos2 : []).map(b => b.I);
    const dMain = S.derive(invInfos.map(i => i.I), bessInfos.map(b => b.I), MODE), dTot = S.derive(allI, allB, MODE);
    const d = LOC2.on ? { ...dTot } : dMain;
    if (LOC2.on && LOC2.to == 'iso') { d.panel = dMain.panel; d.bus = dMain.bus; d.mainCable = dMain.mainCable; d.T = dMain.T; }
    dMain.pvEarth = d.pvEarth = S.pvEarth(invInfos.length);
    d.loadCable = S.cableFor($('loadBrk').value);
    AUTO.forEach(k => { const el = $(k); if (!manual.has(k)) el.value = d[k]; el.classList.toggle('man', manual.has(k)); });
    $('totalKw').value = ((invInfos.reduce((a, i) => a + i.mods, 0) + (LOC2.on ? invInfos2.reduce((a, i) => a + i.mods, 0) : 0)) * wp / 1000).toFixed(2);
    const V = { mode: MODE, loc2on: LOC2.on, loc2to: LOC2.to, loc2name: LOC2.name, loc2cable: LOC2.cableOv || (d2 ? d2.utilCable : ''), loc2earth: d2 ? d2.earthMain : '', loc2pvearth: LOC2.pvEarthOv || (LOC2.on ? S.pvEarth(invInfos2.length) : ''), loc2panel: d2 ? d2.panel : 0, loc2panelI: d2 ? d2.T : 0, panelI: d.T, loc2bus: d2 ? d2.bus : 0 }; document.querySelectorAll('#form input[id], #form select[id]').forEach(el => V[el.id] = el.value);
    $('modeHint').textContent = HINT[MODE]; ['loadName', 'loadBrk', 'loadCable'].forEach(k => $(k).parentElement.hidden = MODE == 'np' || MODE == 'og');
    $('ipL2Box').hidden = !LOC2.on; $('tab_loc2').textContent = LOC2.on ? 'Location 2 ●' : 'Location 2'; $('efrIso').parentElement.hidden = MODE == 'og'; $('isoPanelTitle').textContent = MODE == 'og' ? 'Load distribution board (Load DB)' : 'Isolation panel';
    $('efrMainSet').parentElement.hidden = !$('efrMain').value; $('efrIsoSet').parentElement.hidden = !$('efrIso').value || MODE == 'og';
    $('dcIsoTxt').parentElement.hidden = !$('dcIso').value; $('dcSpdTxt').parentElement.hidden = !$('dcSpd').value;
    $('out').innerHTML = S.renderBlock(V, invInfos, bessInfos, invInfos2, bessInfos2); $('out2').innerHTML = S.renderSLD(V, invInfos, bessInfos, invInfos2, bessInfos2);
    document.querySelectorAll('#invList .inf').forEach((el, i) => { const x = invInfos[i]; el.textContent = `${x.kw} kW · ${x.I} A · AC ${x.ac} · ${S.brkType(x.mccb, x.I)} ${x.mccb} A · ${x.earth}${x.derived ? ' (cable derived – not in file)' : ''}${x.hybrid && x.battKwh ? ` · + ${x.battKwh} kWh integrated battery` : ''}`; });
    document.querySelectorAll('#bessList .inf').forEach((el, i) => { const x = bessInfos[i]; el.textContent = `${x.I.toFixed(1)} A · AC ${x.ac} · ${S.brkType(x.mccb, x.I)} ${x.mccb} A · ${x.earth}`; });
    if (LOC2.on) {
      document.querySelectorAll('#invList2 .inf').forEach((el, i) => { const x = invInfos2[i]; el.textContent = `${x.kw} kW · ${x.I} A · AC ${x.ac} · ${S.brkType(x.mccb, x.I)} ${x.mccb} A · ${x.earth}${x.hybrid && x.battKwh ? ` · + ${x.battKwh} kWh integrated battery` : ''}`; });
      document.querySelectorAll('#bessList2 .inf').forEach((el, i) => { const x = bessInfos2[i]; el.textContent = `${x.I.toFixed(1)} A · AC ${x.ac} · ${S.brkType(x.mccb, x.I)} ${x.mccb} A · ${x.earth}`; });
    }
  }
  let cur = 'out';
  [['t1', 'out'], ['t2', 'out2'], ['t3', 'out3']].forEach(([b, o]) => $(b).onclick = () => {
    cur = o; $('out').hidden = o != 'out'; $('out2').hidden = o != 'out2'; $('out3').hidden = o != 'out3';
    $('t1').classList.toggle('on', o == 'out'); $('t2').classList.toggle('on', o == 'out2'); $('t3').classList.toggle('on', o == 'out3');
    $('dl').hidden = $('pr').hidden = o == 'out3'; if (o == 'out3') drawHistory();
  });
  $('pr').onclick = () => {
    const svgEl = $(cur).querySelector('svg'); if (!svgEl) return;
    const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(svgEl));
    const img = new Image();
    img.onload = () => {
      const W = 4134, H = 2925; // ~354dpi A4 landscape — pushed further for maximum sharpness
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.drawImage(img, 0, 0, W, H);
      try {
        const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
        pdf.addImage(cv.toDataURL('image/png'), 'PNG', 0, 0, 297, 210);
        pdf.save(($('dno').value || 'SLD') + (cur == 'out' ? '_block' : '_SLD') + '_' + MODE + '.pdf');
      } catch (err) { alert('PDF export failed (' + err.message + '). Print to PDF from your browser instead.'); }
    };
    img.onerror = () => alert('PDF export failed — your browser blocked rendering the drawing (this needs an internet connection the first time, to load the PDF library). Print to PDF from your browser instead.');
    img.src = svgUrl;
  };
  $('dl').onclick = () => {
    const svgEl = $(cur).querySelector('svg'); if (!svgEl) return;
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([SLD.toDXF(svgEl)], { type: 'application/dxf' }));
      a.download = ($('dno').value || 'SLD') + (cur == 'out' ? '_block' : '_SLD') + '_' + MODE + '.dxf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch (err) { alert('CAD export failed (' + err.message + ').'); }
  };

  // ---- History: saved revisions kept in this browser (localStorage), so a project's past states can be reopened later ----
  const HKEY = 'sld_history_v1', HMAX = 60;
  const hLoad = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } };
  const hSave = list => { try { localStorage.setItem(HKEY, JSON.stringify(list.slice(0, HMAX))); } catch (e) { } };
  const flash = m => { $('msg').textContent = m; setTimeout(() => { if ($('msg').textContent == m) $('msg').textContent = ''; }, 2500); };
  $('sv').onclick = () => {
    const fields = {}; document.querySelectorAll('#form input[id], #form select[id]').forEach(el => fields[el.id] = el.value);
    const def = (fields.dno || 'Drawing') + ' — ' + (fields.opt || '') + ' (' + MODE + ')';
    const label = prompt('Save this revision as:', def); if (label == null) return;
    const list = hLoad();
    list.unshift({ id: Date.now(), ts: new Date().toISOString(), label: label || def, mode: MODE, fields, manual: [...manual], invs: JSON.parse(JSON.stringify(INVS)), bess: JSON.parse(JSON.stringify(BESSU)), loc2: JSON.parse(JSON.stringify(LOC2)), invs2: JSON.parse(JSON.stringify(INVS2)), bess2: JSON.parse(JSON.stringify(BESSU2)) });
    hSave(list); flash('Saved to history.'); if (cur == 'out3') drawHistory();
  };
  function hApply(e) {
    MODE = e.mode; document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode == MODE));
    manual.clear(); (e.manual || []).forEach(k => manual.add(k));
    INVS = JSON.parse(JSON.stringify(e.invs || INVS)); BESSU = JSON.parse(JSON.stringify(e.bess || []));
    LOC2 = JSON.parse(JSON.stringify(e.loc2 || { on: false, to: 'main', name: 'Location 2', cableOv: '', pvEarthOv: '' })); INVS2 = JSON.parse(JSON.stringify(e.invs2 || [])); BESSU2 = JSON.parse(JSON.stringify(e.bess2 || []));
    drawInvs(); drawBess(); drawLoc2Shell();
    Object.keys(e.fields || {}).forEach(k => { const el = $(k); if (el) el.value = e.fields[k]; });
    update(); flash('Loaded "' + e.label + '".');
    cur = 'out'; $('out').hidden = false; $('out2').hidden = true; $('out3').hidden = true;
    $('t1').classList.add('on'); $('t2').classList.remove('on'); $('t3').classList.remove('on');
  }
  function drawHistory() {
    const list = hLoad();
    $('out3').innerHTML = list.length ? list.map(e => `<div class="hist-item" data-id="${e.id}"><div><b>${esc(e.label)}</b><span>${new Date(e.ts).toLocaleString()}</span></div><div class="btns"><button type="button" class="alt" data-a="load">Load</button><button type="button" class="alt ic" data-a="del">Delete</button></div></div>`).join('')
      : '<p class="hist-empty">No saved revisions yet — use "💾 Save to history" above to keep a copy of the current configuration.</p>';
  }
  $('out3').addEventListener('click', e => {
    const item = e.target.closest('.hist-item'); if (!item) return;
    const id = +item.dataset.id, list = hLoad(), e2 = list.find(x => x.id == id); if (!e2) return;
    if (e.target.dataset.a == 'load') hApply(e2);
    else if (e.target.dataset.a == 'del') { if (confirm('Delete "' + e2.label + '"?')) { hSave(list.filter(x => x.id != id)); drawHistory(); } }
  });
  drawInvs(); drawBess(); drawLoc2Shell(); update();
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
