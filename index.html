<title>Solar SLD Generator</title>
<script>
/* ===== TEAM SETTINGS (admin: edit these two lines, then upload index.html) =====
   dataRepo:     the repository that holds the shared History, e.g. "udithapana/sld-team-data".
                 Make that repository PRIVATE so only people with a token can read it. "" = use this website's own repository.
   requireToken: true = the app shows a sign-in screen and only opens for team members.
   users:        username + password sign-in. Create each line on the admin page (open the app link with #admin at the end) and paste it here.

  }
